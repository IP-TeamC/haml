<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sudoku Validator</title>

<style>
    :root {
        --bg: #1f1f1f;
        --panel: #2a2a2a;
        --panel2: #333;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --correct: #22c55e;
        --wrong: #ef4444;
        --border: #444;
    }

    body {
        margin: 0;
        font-family: system-ui, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px;
    }

    h1 {
        margin-bottom: 5px;
        font-weight: 700;
    }

    p {
        color: var(--muted);
        margin-top: 0;
        margin-bottom: 20px;
        font-size: 14px;
    }

    .card {
        width: 95%;
        max-width: 1000px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    textarea {
        width: 97%;
        height: 200px;
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        font-family: monospace;
        resize: vertical;
    }

    .board {
        margin-top: 20px;
        display: grid;
        grid-template-columns: repeat(3, auto);
        gap: 8px;
        justify-content: center;
    }

    .cell {
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 18px;
        background: #2f2f2f;
        border: 1px solid #444;
        border-radius: 6px;
    }

    .fixed-correct {
        background: #3a3a3a;
        color: #d1d5db;
    }

    .fixed-wrong {
        background: rgba(226, 136, 19, 0.25);
        border-color: #e28813;
        color: #f8c685;
    }

    .correct {
        background: rgba(34, 197, 94, 0.25);
        border-color: #22c55e;
        color: #86efac;
    }

    .wrong {
        background: rgba(239, 68, 68, 0.25);
        border-color: #ef4444;
        color: #fca5a5;
    }


    .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        color: var(--muted);
        font-size: 14px;
    }
</style>
</head>

<body>

<h1>Sudoku Validator</h1>
<p>Füge deinen VHDL-Log ein – Fehler werden rot markiert.</p>

<div class="card">
    <textarea id="input" placeholder="Log hier einfügen..."></textarea>

    <div class="topbar" id="status"></div>

    <div id="output" class="board"></div>
</div>

<script>
const solution = [
    [7,6,1,5,8,2,9,3,4],
    [2,4,5,3,1,9,6,8,7],
    [9,8,3,6,7,4,2,5,1],

    [8,3,7,1,9,6,4,2,5],
    [4,9,6,7,2,5,3,1,8],
    [1,5,2,4,3,8,7,6,9],

    [3,2,4,8,5,7,1,9,6],
    [5,7,9,2,6,1,8,4,3],
    [6,1,8,9,4,3,5,7,2]
];

const hs_unsolved = [
    [7,0,0,5,8,2,9,3,4],
    [2,0,5,0,1,9,0,0,7],
    [0,0,3,0,0,0,2,0,1],

    [0,3,7,1,0,6,4,2,5],
    [4,9,0,7,0,0,0,1,0],
    [0,5,2,0,3,8,7,0,0],

    [0,2,0,0,5,7,1,9,6],
    [5,7,9,2,6,0,0,0,3],
    [6,0,0,0,4,3,5,7,2]
];

function parseSudoku(text) {
    const lines = text.split("\n");
    const grid = [];

    for (const line of lines) {
        if (line.includes("|") && /\d/.test(line)) {
            const nums = line
                .split("|")
                .map(p => p.trim())
                .filter(Boolean)
                .map(p => p.split(/\s+/).map(Number).filter(n => !isNaN(n)))
                .flat();

            if (nums.length === 9) {
                grid.push(nums);
            }
        }
    }
    return grid;
}

function validate() {
    const input = document.getElementById("input").value;
    const grid = parseSudoku(input);

    const out = document.getElementById("output");
    const status = document.getElementById("status");

    out.innerHTML = "";

    let errors = 0;

    // 3x3 Blöcke bauen
    for (let br = 0; br < 3; br++) {
        for (let bc = 0; bc < 3; bc++) {

            const block = document.createElement("div");
            block.style.display = "grid";
            block.style.gridTemplateColumns = "repeat(3, 48px)";
            block.style.gap = "2px";

            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3; c++) {

                    const row = br * 3 + r;
                    const col = bc * 3 + c;

                    const val = grid[row][col];
                    const cell = document.createElement("div");
                    cell.className = "cell";

                    const isFixed = hs_unsolved[row][col] !== 0;

                    cell.textContent = val;

                    if (val === solution[row][col]) {
                        if (isFixed) {
                            cell.classList.add("fixed-correct");
                        } else {
                            cell.classList.add("correct");
                        }
                    } else {
                        if (isFixed) {
                            cell.classList.add("fixed-wrong");
                        } else {
                            cell.classList.add("wrong");
                        }
                        errors++;
                    }

                    block.appendChild(cell);
                }
            }

            out.appendChild(block);
        }
    }

    status.textContent =
        errors === 0
        ? "✅ Sudoku korrekt gelöst"
        : `⚠️ Fehlerhafte Felder: ${errors}`;
}

const inputField = document.getElementById("input");

let debounceTimer = null;

function autoValidate() {
    clearTimeout(debounceTimer);

    debounceTimer = setTimeout(() => {
        validate();
    }, 300); // verhindert Flackern beim schnellen Einfügen
}

// Tippen
inputField.addEventListener("input", autoValidate);

// STRG+V / CMD+V
inputField.addEventListener("paste", () => {
    setTimeout(autoValidate, 50);
});
</script>

</body>
</html>
