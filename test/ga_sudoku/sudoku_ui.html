<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sudoku UI</title>
        <link rel="icon" type="image/x-icon" href="../../docs/public/haml-icon.svg">

        <style>
        :root {
            --bg: #1a1a1a;
            --text: #e5e7eb;
            --muted: #9ca3af;
        }

        body {
            margin: 0;
            font-family: system-ui, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }

        h1 {
            font-weight: 700;
            margin-bottom: 2px;
        }

        .board {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(3, auto);
            gap: 8px;
            justify-content: center;

            padding: 12px;
            border-radius: 12px;
            transition: box-shadow 0.5s ease, background-color 0.5s ease;
        }

        .board.solved-glow {
            box-shadow: 0 0 40px rgba(34, 197, 94, 0.4);
            background-color: rgba(34, 197, 94, 0.05);
        }

        .cell {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            background: #2f2f2f;
            border: 1px solid #444;
            border-radius: 6px;
            position: relative;
        }

        /* Modus 1: Lösung ist bekannt (Grün / Rot) */
        .fixed-correct { background:#3a3a3a; color:#d1d5db; }
        .fixed-wrong { background:rgba(226,136,19,0.25); border-color:#e28813; color:#f8c685; }
        .correct { background:rgba(19, 187, 81, 0.25); border-color:#22c55e; color:#86efac; }
        .wrong { background:rgba(206, 34, 34, 0.25); border-color:#cf2828; color:#fca5a5; }

        /* Modus 2: Keine Lösung bekannt (Blau / Orange / Grau) */
        .fixed-field { background:#3a3a3a; color:#d1d5db; }
        .fixed-conflict-field { background:#3a3a3a; border-color:#dee213; color:#f8eb85; }
        .guess-field { background:rgba(255,255,255,0.25); color:#d1d5db; }
        .conflict-field { background:rgba(226,226,00,0.25); border-color:#dee213; color:#f8eb85; }

        .topbar {
            display:flex;
            justify-content:center;
            margin-top:20px;
            margin-bottom:0px;
        }

        #status {
            color: var(--muted);
        }

        canvas { margin-top: 10px; }

        #replay { margin-top: 18px; margin-bottom: 20px; width: 460px;}

        #fitnessChart {
            border: 1px solid #444;
            border-radius: 10px;
        }

        .chart-wrapper {
            position: relative;
        }

        /* --- WebSocket Toast --- */
        #ws-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2a2a2a;
            border: 1px solid #444;
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-size: 14px;
            z-index: 5000;
            transition: border-color 0.3s ease;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        /* Status: Verbunden */
        #ws-toast.connected { border-color: rgba(34, 197, 94, 0.4); }
        #ws-toast.connected .status-dot {
            background-color: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        /* Status: Getrennt */
        #ws-toast.disconnected { border-color: rgba(239, 68, 68, 0.4); }
        #ws-toast.disconnected .status-dot {
            background-color: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }

        #ws-reconnect-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }

        #ws-switch-btn {
            background: #4b5563;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }

        #ws-btn:hover { background: #d11111; }
        #ws-btn:active { transform: scale(0.95); }

        /* Container für den Startbildschirm */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        #log-input-group {
            gap: 10px;
        }

        #log-input {
            padding: 10px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #2f2f2f;
            color: white;
            outline: none;
            width: 250px;
        }

        #connect-btn {
            padding: 5px 15px;
            font-size: 24px;
            background: #2f2f2f;
            color: white;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #connect-btn:hover {
            background: #444;
        }

        #start-screen-message {
            color: var(--muted);
            font-size: 24px;
            font-weight: bold;
        }
                
    </style>
    </head>

    <body>

        <div id="start-screen">
            <div id="log-input-group" style="display: none;">
                <input type="text" id="log-input" placeholder="Log-Name eingeben">
                <button id="connect-btn">⮚</button>
            </div>
            <div id="start-screen-message"></div>
        </div>

        <h1 id="sudoku-title">Sudoku</h1>
        <div id="meta" class="topbar"></div>
        <div id="output" class="board"></div>

        <input id="replay" type="range" min="0" max="0" value="0">

        <div class="chart-wrapper">
            <canvas id="fitnessChart" width="460" height="120"></canvas>
        </div>

        <div id="ws-toast" class="disconnected">
            <div class="status-dot"></div>
            <span id="ws-status-text">Disconnected</span>
            <button id="ws-switch-btn" class="switch" style="display: none;">Switch</button>
            <button id="ws-reconnect-btn" class="disconnected" style="display: none;">Connect</button>
        </div>

        <script>
    let latest = null;
    let history = [];
    let replayMode = false;

    let solution = null;
    let fixedMask = null;

    let ws;
    let currentLogFile = null;

    const sudokuTitle = document.getElementById("sudoku-title");
    
    const toast = document.getElementById("ws-toast");
    const toastText = document.getElementById("ws-status-text");
    const switchBtn = document.getElementById("ws-switch-btn");
    const reconnectBtn = document.getElementById("ws-reconnect-btn");

    // UI Elemente für Startbildschirm
    const startScreen = document.getElementById("start-screen");
    const logInput = document.getElementById("log-input");
    const logInputGroup = document.getElementById("log-input-group");
    const connectBtn = document.getElementById("connect-btn");
    const startScreenMessage = document.getElementById("start-screen-message");
    
    logInput.addEventListener("keypress", (event) => {
        if (event.key === "Enter") {
            event.preventDefault();
            connectBtn.click();
        }
    });

    connectBtn.addEventListener("click", () => {
        let file = logInput.value.trim();
        if (!file) return;
        if (ws && ws.readyState === WebSocket.OPEN) {
            if (!file.toLowerCase().endsWith(".log")) file += ".log";
            currentLogFile = file;
            sudokuTitle.innerText = "Sudoku " + file; 
            document.title = "Sudoku " + file;

            toastText.textContent = "Connected";
            switchBtn.style.display = "inline-block";

            startScreenMessage.textContent = "Warte auf Daten für " + file + "...";
            startScreenMessage.style.display = "block";
            logInputGroup.style.display = "none"

            ws.send(JSON.stringify({ type: "watch_file", file: file }));
        }
        else {
            startScreenMessage.textContent = "Keine aktive Verbindung zum WebSocket!";
            startScreenMessage.style.display = "block";
            logInputGroup.style.display = "none"
        }
    });

    switchBtn.addEventListener("click", () => {
        currentLogFile = null;
        toastText.textContent = "Connected";
        switchBtn.style.display = "none";

        document.title = "Sudoku UI";

        startScreen.style.display = "flex";
        startScreenMessage.textContent = "";
        startScreenMessage.style.display = "none";
        logInputGroup.style.display = "flex"
        logInput.focus();

        ws.send(JSON.stringify({ type: "stop_watch" }));
        
        history = [];
        latest = null;
        solution = null;
        fixedMask = null;
        render();
        drawChart();
    });

    function connectWS() {
        startScreenMessage.textContent = "Verbindung mit Bridge wird hergestellt...";
        startScreenMessage.style.display = "block";
        logInputGroup.style.display = "none"

        toastText.textContent = "Connecting...";
        toast.className = "disconnected";
        toastText.style.color = "var(--muted)";
        reconnectBtn.style.display = "none";

        ws = new WebSocket("ws://localhost:8080");

        ws.onopen = () => {
            console.log("WebSocket connected")

            startScreenMessage.textContent = "";
            startScreenMessage.style.display = "none";
            logInputGroup.style.display = "flex"
            logInput.focus();

            toastText.textContent = "Connected";
            toastText.style.color = "var(--text)";
            toast.className = "connected";
            reconnectBtn.style.display = "none";

            if (currentLogFile) {
                switchBtn.style.display = "inline-block";
                ws.send(JSON.stringify({ type: "watch_file", file: currentLogFile }));
            } else {
                switchBtn.style.display = "none";
            }
        };

        ws.onclose = () => {
            console.log("WebSocket disconnected")

            startScreenMessage.textContent = "WebSocket nicht verbunden!";
            startScreenMessage.style.display = "block";
            logInputGroup.style.display = "none"

            toastText.textContent = "Disconnected";
            toastText.style.color = "#fca5a5";
            toast.className = "disconnected";
            reconnectBtn.style.display = "block";

            switchBtn.style.display = "none";
        };

        ws.onerror = (err) => {
            console.error("WebSocket Fehler:", err);
            ws.close();
        };

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            console.log(msg);

            if (msg.solution) solution = msg.solution;
            if (msg.fixedMask) fixedMask = msg.fixedMask;

            // INITIAL FULL STATE
            if (msg.type === "init") {
                startScreen.style.display = "none"; // Startbildschirm ausblenden
            
                history = msg.history || [];
                latest = msg.latest || null;

                if (!solution) {
                    for (let i = history.length - 1; i >= 0; i--) {
                        checkAndSetSolution(history[i].grid);
                        if (solution) break;
                    }
                }

                updateSlider();
                render();
                drawChart();
                return;
            }

            // LIVE UPDATE
            if (msg.type === "grid") {
                history.push(msg);

                if (!replayMode) latest = msg;

                if (!solution) {
                    checkAndSetSolution(msg.grid);
                }

                updateSlider();
                drawChart();

                if (!replayMode) {
                    render();
                }
            }
        };
    }

    reconnectBtn.addEventListener("click", connectWS);
    connectWS();

    function hasConflict(grid, r, c, val) {
        if (val === 0) return false;
        
        for (let i = 0; i < 9; i++) {
            if (i !== c && grid[r][i] === val) return true;
        }
        for (let i = 0; i < 9; i++) {
            if (i !== r && grid[i][c] === val) return true;
        }
        const br = Math.floor(r / 3) * 3;
        const bc = Math.floor(c / 3) * 3;
        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                const rr = br + i;
                const cc = bc + j;
                if ((rr !== r || cc !== c) && grid[rr][cc] === val) return true;
            }
        }
        return false;
    }

    function render() {
        if (!latest) return;

        const out = document.getElementById("output");
        const meta = document.getElementById("meta");

        out.innerHTML = "";

        let errors = 0;
        let emptyCells = 0;

        for (let br = 0; br < 3; br++) {
            for (let bc = 0; bc < 3; bc++) {

                const block = document.createElement("div");
                block.style.display = "grid";
                block.style.gridTemplateColumns = "repeat(3, 48px)";
                block.style.gap = "2px";

                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 3; c++) {

                        const row = br * 3 + r;
                        const col = bc * 3 + c;

                        const val = latest.grid[row][col];
                        const isFixed = fixedMask ? fixedMask[row][col] : false;

                        const cell = document.createElement("div");
                        cell.className = "cell";
                        
                        cell.textContent = val === 0 ? "" : val;
                        if (val === 0) emptyCells++;

                        if (solution) {
                            if (val === 0) {
                                cell.classList.add(isFixed ? "fixed-field" : "guess-field");
                            } else {
                                const isCorrect = (val === solution[row][col]);
                                if (isCorrect) {
                                    cell.classList.add(isFixed ? "fixed-correct" : "correct");
                                } else {
                                    cell.classList.add(isFixed ? "fixed-wrong" : "wrong");
                                    errors++;

                                    const hint = document.createElement("div");
                                    hint.style.position = "absolute";
                                    hint.style.bottom = "2px";
                                    hint.style.right = "4px";
                                    hint.style.fontSize = "10px";
                                    hint.style.color = "#9ca3af";
                                    hint.textContent = solution[row][col];
                                    cell.appendChild(hint);
                                }
                            }
                        } else {
                            const conflict = (val !== 0 && hasConflict(latest.grid, row, col, val));
                            
                            if (conflict) {
                                errors++;
                            }

                            if (isFixed && conflict) {
                                cell.classList.add("fixed-conflict-field");
                            } else if (isFixed) {
                                cell.classList.add("fixed-field");
                            } else if (conflict) {
                                cell.classList.add("conflict-field");
                            } else {
                                cell.classList.add("guess-field");
                            }
                        }

                        block.appendChild(cell);
                    }
                }
                out.appendChild(block);
            }
        }

        let isSolved = false;
        let infoText = "";

        if (emptyCells > 0) {
            isSolved = false;
            infoText = `⏳ Unvollständig (${emptyCells} leer)`;
        } else {
            isSolved = (errors === 0);
            if (solution) {
                infoText = isSolved ? "✅ Solved" : `❌ Fehler: ${errors}`;
            } else {
                if (isSolved) {
                    infoText = "✅ Solved";
                } else {
                    infoText = `⚠️ Konflikte: ${errors}`;
                }
            }
        }

        const timeString = latest.time ? ` - 🕒 ${latest.time}` : "";

        const fitText = latest.fitness !== null 
            ? `📊 Fitness: ${latest.fitness}` 
            : "🧩 Problem (Init)";

        meta.textContent = latest.generation !== undefined && latest.generation !== null
            ? `🧬 Generation: ${latest.generation} - ${fitText} - ${infoText}` + timeString
            : "";

        if (isSolved) {
            out.classList.add("solved-glow");
        } else {
            out.classList.remove("solved-glow");
        }
    }

    const slider = document.getElementById("replay");

    function updateSlider() {
        slider.max = Math.max(0, history.length - 1);

        if (!replayMode) {
            slider.value = history.length - 1;
        }
    }

    slider.addEventListener("input", () => {
        const isAtEnd = Number(slider.value) === Number(slider.max);
        replayMode = !isAtEnd;

        const snap = history[Number(slider.value)];
        if (!snap) return;

        latest = snap;
        render();
    });

    const canvas = document.getElementById("fitnessChart");
    const ctx = canvas.getContext("2d");

    function drawChart() {
        const chartData = history.filter(h => h.generation > 0 && h.fitness !== null);

        if (chartData.length < 2) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            return;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const minFitness = 0;
        const maxFitness = Math.max(1, ...chartData.map(h => h.fitness || 0));
        const bestFitness = Math.min(...chartData.map(h => h.fitness || 0));

        const padding = 10;
        const w = canvas.width - padding * 2;
        const h = canvas.height - padding * 2;

        ctx.strokeStyle = "rgba(255,255,255,0.05)";
        ctx.lineWidth = 1;

        for (let i = 0; i <= 5; i++) {
            const y = padding + (i / 5) * h;
            ctx.beginPath();
            ctx.moveTo(padding, y);
            ctx.lineTo(canvas.width - padding, y);
            ctx.stroke();
        }

        for (let i = 1; i < chartData.length; i++) {
            const h1 = chartData[i - 1];
            const h2 = chartData[i];

            const x1 = padding + ((i - 1) / (chartData.length - 1)) * w;
            const x2 = padding + (i / (chartData.length - 1)) * w;

            const norm1 = (h1.fitness - minFitness) / (maxFitness - minFitness || 1);
            const norm2 = (h2.fitness - minFitness) / (maxFitness - minFitness || 1);

            const y1 = padding + (1 - norm1) * h;
            const y2 = padding + (1 - norm2) * h;

            const t = norm2;
            const r = Math.floor(255 * t);
            const g = Math.floor(255 * (1 - t));
            const b = 80;

            ctx.strokeStyle = `rgb(${r}, ${g}, ${b})`;
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }

        ctx.fillStyle = "#9ca3af";
        ctx.font = "10px sans-serif";

        ctx.fillText(`max: ${maxFitness}`, 10, 10);
        ctx.fillText(`min: ${minFitness}`, 10, canvas.height - 5);

        const clamp = (val, min, max) => Math.min(Math.max(val, min), max);

        const rawY = padding + (1 - (bestFitness / (maxFitness || 1))) * h;
        const clampedY = clamp(rawY, 20, canvas.height - 15);

        ctx.fillText(`best: ${bestFitness}`, 10, clampedY);
    }

    function checkAndSetSolution(grid) {
        if (solution) return;

        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                const val = grid[r][c];
                if (val === 0) return;
                if (hasConflict(grid, r, c, val)) return;
            }
        }
        
        solution = JSON.parse(JSON.stringify(grid));
        console.log("Lösung on-the-fly gefunden und gespeichert!");
    }
    </script>

    </body>
</html>
